<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" fill="none">
  <!-- Ilustración 2D de mostrador de cafetería artesanal -->
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="420" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4a2c1d"/>
      <stop offset="100%" stop-color="#2c1810"/>
    </linearGradient>
    <linearGradient id="cupBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#ebd9c3"/>
    </linearGradient>
    <linearGradient id="caramel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e39d5b"/>
      <stop offset="100%" stop-color="#b86628"/>
    </linearGradient>
  </defs>

  <!-- Fondo cálido redondeado -->
  <rect width="420" height="300" rx="24" fill="url(#bgGlow)"/>
  <circle cx="350" cy="56" r="78" fill="#c87a3b" fill-opacity="0.14"/>
  <circle cx="62" cy="242" r="90" fill="#f7f1e8" fill-opacity="0.06"/>

  <!-- Lámparas colgantes de cafetería -->
  <line x1="110" y1="0" x2="110" y2="44" stroke="#d9b99b" stroke-width="2.5"/>
  <path d="M90 44h40l-7 18H97l-7-18Z" fill="#c87a3b"/>
  <ellipse cx="110" cy="63" rx="14" ry="4" fill="#ffe6b8"/>

  <line x1="310" y1="0" x2="310" y2="34" stroke="#d9b99b" stroke-width="2.5"/>
  <path d="M292 34h36l-6 16h-24l-6-16Z" fill="#c87a3b"/>
  <ellipse cx="310" cy="51" rx="12" ry="3.5" fill="#ffe6b8"/>

  <!-- Mostrador de madera -->
  <rect x="28" y="218" width="364" height="16" rx="8" fill="#c87a3b"/>
  <rect x="42" y="234" width="336" height="44" rx="10" fill="#3a2116"/>

  <!-- Máquina de espresso 2D (izquierda) -->
  <rect x="58" y="114" width="96" height="104" rx="12" fill="#e8d8c6"/>
  <rect x="66" y="124" width="80" height="24" rx="6" fill="#4a2c1d"/>
  <circle cx="82" cy="136" r="5" fill="#e39d5b"/>
  <circle cx="98" cy="136" r="5" fill="#1e6f46"/>
  <rect x="112" y="132" width="24" height="8" rx="4" fill="#fffaf3" fill-opacity="0.7"/>
  <rect x="76" y="156" width="60" height="48" rx="6" fill="#2c1810"/>
  <!-- Taza pequeña bajo el espresso -->
  <path d="M94 180h24v14a6 6 0 0 1-6 6h-12a6 6 0 0 1-6-6v-14Z" fill="#fffdf9"/>
  <rect x="102" y="156" width="8" height="12" rx="2" fill="#c87a3b"/>
  <line x1="106" y1="168" x2="106" y2="180" stroke="#c87a3b" stroke-width="3" stroke-linecap="round"/>

  <!-- Taza principal de Latte humeante (centro) -->
  <path d="M190 144h68v46a22 22 0 0 1-22 22h-24a22 22 0 0 1-22-22v-46Z" fill="url(#cupBody)"/>
  <path d="M258 154h12a13 13 0 0 1 0 26h-12" stroke="#ebd9c3" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="224" cy="144" rx="34" ry="8" fill="#6f422b"/>
  <ellipse cx="224" cy="144" rx="22" ry="4.5" fill="#e6c49f"/>
  <!-- Plato -->
  <ellipse cx="224" cy="214" rx="48" ry="7" fill="#d9c3ac"/>
  <!-- Vapor 2D -->
  <path d="M208 124c0-10 8-12 8-22" stroke="#f7e3c8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M224 120c0-12 8-14 8-26" stroke="#f7e3c8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M240 124c0-10 8-12 8-22" stroke="#f7e3c8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Plato con Croissant 2D (derecha) -->
  <ellipse cx="330" cy="212" rx="40" ry="7" fill="#fffdf9"/>
  <path d="M298 205c8-24 56-24 64 0-6 9-18 12-32 12s-26-3-32-12Z" fill="url(#caramel)"/>
  <path d="M314 191l6 23" stroke="#8f4c1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M346 191l-6 23" stroke="#8f4c1a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M330 187v28" stroke="#8f4c1a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
