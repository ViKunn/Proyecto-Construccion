# Sesión
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=CAFETERIA_SESION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Si se trabajara con HTTPS, el atributo secure debería ser true 
server.servlet.session.cookie.secure=false

# Imágenes
app.imagenes.directorio=uploads/productos
app.imagenes.max-bytes=2097152
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB


# Negativo (o 0) = sin límite. Positivo = máximo de unidades por producto en un pedido
app.pedidos.cantidad-maxima-por-producto=-1

# Rechaza decimales en campos enteros en vez de truncarlos (RN-NEG-01)
spring.jackson.deserialization.accept-float-as-int=false